services:
  db:
    image: postgres:15
    container_name: event_db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: event_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: event_backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      POSTGRES_DB: event_db
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_pass
      POSTGRES_HOST: db      # must match service name
      POSTGRES_PORT: 5432
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
